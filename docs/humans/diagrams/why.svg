<text class="d-tick" x="782" y="450" text-anchor="middle">70m</text>
<line class="d-grid" x1="880" y1="36" x2="880" y2="428" stroke-dasharray="2 5"/>
<text class="d-tick" x="880" y="450" text-anchor="middle">80m</text>
