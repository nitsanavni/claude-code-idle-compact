<text class="g-sub" x="382" y="251" text-anchor="middle">idleSeconds</text></g>
<g class="h-sky"><rect class="g-box" x="568" y="205" width="168" height="62" rx="31"/>
<text class="g-title" x="652" y="233" text-anchor="middle">Checking</text>
<text class="g-sub" x="652" y="251" text-anchor="middle">how big is it?</text></g>
