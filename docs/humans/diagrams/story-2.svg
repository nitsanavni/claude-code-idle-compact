<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 523" width="920" height="523" role="img" font-family="Inter, system-ui, sans-serif"><title>Claude can compact its own context when a piece of work is done</title><style>/* Diagram style guide: shared by every human-facing diagram in docs/.
   Clear and vivid on a cool white page: Inter for words, JetBrains Mono for source,
   six saturated series hues with a fixed role each. Flat marks: no gradients, no glows.
   Tokens first; components below. Generators inline this file, so keep it small. */

:root {
  /* surfaces */
  --bg:        #f4f6fb;
  --surface:   #ffffff;
  --rule:      #dfe4ee;
  --grid:      #eceff6;
  /* text */
  --ink:       #151a2d;
  --ink-2:     #4a5268;
  --ink-3:     #687087;
  /* series hues, each with a tint. Fixed roles across all diagrams:
     blue = user, violet = timer, green = compact fired, coral = cancel, amber = warning/threshold, teal = system */
  --blue:   #2563eb;  --blue-tint:   #e8effe;
  --green:  #0b8457;  --green-tint:  #e0f5ec;
  --amber:  #b45309;  --amber-tint:  #fdf0d9;
  --coral:  #d92d4f;  --coral-tint:  #fde7ec;
  --violet: #7c3aed;  --violet-tint: #efe9fe;
  --teal:   #0e7c9a;  --teal-tint:   #def3f8;
  --on-hue: #ffffff;  /* glyphs inside a marble */

  --sans:  Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, "Times New Roman", serif;  /* titles */
  --mono:  "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --radius: 16px;
  --space:  8px;            /* everything is a multiple of this */
  --measure: 62ch;          /* comfortable line length for prose */
  --shadow: 0 1px 2px rgb(20 26 45 / .04), 0 8px 24px -12px rgb(20 26 45 / .12);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121622; --surface: #1a1f2e; --rule: #2c3347; --grid: #232a3b;
    --ink: #eef1f8; --ink-2: #aab3c7; --ink-3: #8791a8;
    --blue: #6ea8ff; --green: #3ddc97; --amber: #ffb84d; --coral: #ff7a90; --violet: #b79bff; --teal: #3fd0e6;
    --blue-tint:   color-mix(in srgb, var(--blue) 16%, var(--surface));
    --green-tint:  color-mix(in srgb, var(--green) 16%, var(--surface));
    --amber-tint:  color-mix(in srgb, var(--amber) 16%, var(--surface));
    --coral-tint:  color-mix(in srgb, var(--coral) 16%, var(--surface));
    --violet-tint: color-mix(in srgb, var(--violet) 16%, var(--surface));
    --teal-tint:   color-mix(in srgb, var(--teal) 16%, var(--surface));
    --on-hue: var(--bg);
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121622; --surface: #1a1f2e; --rule: #2c3347; --grid: #232a3b;
  --ink: #eef1f8; --ink-2: #aab3c7; --ink-3: #8791a8;
  --blue: #6ea8ff; --green: #3ddc97; --amber: #ffb84d; --coral: #ff7a90; --violet: #b79bff; --teal: #3fd0e6;
  --blue-tint:   color-mix(in srgb, var(--blue) 16%, var(--surface));
  --green-tint:  color-mix(in srgb, var(--green) 16%, var(--surface));
  --amber-tint:  color-mix(in srgb, var(--amber) 16%, var(--surface));
  --coral-tint:  color-mix(in srgb, var(--coral) 16%, var(--surface));
  --violet-tint: color-mix(in srgb, var(--violet) 16%, var(--surface));
  --teal-tint:   color-mix(in srgb, var(--teal) 16%, var(--surface));
  --on-hue: var(--bg);
  --shadow: none;
  color-scheme: dark;
}

/* svg vocabulary (diagram generators emit these classes) */
.d-grid   { stroke: var(--grid); stroke-width: 1; }
.d-tick   { font: 500 11px var(--sans); fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.d-lane   { font: 600 12px var(--sans); fill: var(--ink-2); }
.d-lane-bar { fill: var(--h); }
.d-line   { stroke: var(--rule); stroke-width: 2; stroke-linecap: round; }
.d-end    { stroke: var(--ink-2); stroke-width: 2; stroke-linecap: round; }
.d-label  { font: 600 13px var(--sans); fill: var(--ink); }
.d-sub    { font: 400 12px var(--sans); fill: var(--ink-2); }
.d-span-label { font: 600 12px var(--sans); fill: var(--ink); }

/* hue helpers: .h-blue etc. set --h / --t for marks. The older names map onto the new roles. */
.h-ink    { --h: var(--ink-2);  --t: var(--grid); }
.h-mute   { --h: var(--ink-3);  --t: var(--grid); }
.h-blue,   .h-sky  { --h: var(--blue);   --t: var(--blue-tint); }
.h-green,  .h-sage { --h: var(--green);  --t: var(--green-tint); }
.h-amber,  .h-sand { --h: var(--amber);  --t: var(--amber-tint); }
.h-coral,  .h-rose { --h: var(--coral);  --t: var(--coral-tint); }
.h-violet, .h-plum { --h: var(--violet); --t: var(--violet-tint); }
.h-teal   { --h: var(--teal);   --t: var(--teal-tint); }
.d-dot      { fill: var(--h); stroke: var(--surface); stroke-width: 3; }
.d-dot-core { fill: var(--h); }
.d-glyph    { font: 700 10px var(--sans); fill: var(--on-hue); }
.d-halo     { fill: var(--t); }
.d-span     { fill: var(--t); stroke: var(--h); stroke-width: 1.5; }
.d-bold     { stroke: var(--h); stroke-width: 5; stroke-linecap: round; opacity: 0; }  /* a span at the schematic level */
.d-ascii    { font: 500 18px var(--mono); fill: var(--ink-3); opacity: 0; font-variant-ligatures: none; }  /* the text level: the source, wordless */
.d-ascii-name { font: 500 18px var(--mono); fill: var(--ink-2); opacity: 0; }
.d-ascii .a-span { fill: var(--h); font-weight: 800; }
.d-ascii .a-dot  { fill: var(--h); }
.d-ascii .a-x    { fill: var(--coral); font-weight: 800; }
.d-ghost    { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 4 4; }
.d-cancel   { stroke: var(--coral); stroke-width: 2.5; stroke-linecap: round; }
.d-arrow    { fill: var(--h); }
.d-bg       { fill: var(--surface); stroke: var(--rule); }
.d-break-gap   { fill: var(--surface); }
.d-break-mark  { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-linecap: round; }
.d-break-label { font: 500 11px var(--sans); fill: var(--ink-3); }
@media (prefers-reduced-motion: no-preference) {
  .d-mark { animation: d-pop 150ms ease-out both; animation-delay: calc(var(--i, 0) * 70ms); transform-box: fill-box; transform-origin: center; }
  @keyframes d-pop { from { opacity: 0; transform: scale(.6); } }
}


.g-box    { fill: var(--t); stroke: var(--h); stroke-width: 1.5; }
.g-box.dashed, .g-group { stroke-dasharray: 5 5; }
.g-group  { fill: none; stroke: var(--ink-3); stroke-width: 1.25; stroke-opacity: .6; }
.g-title  { font: 600 13px var(--sans); fill: var(--ink); }
.g-sub    { font: 400 12px var(--sans); fill: var(--ink-2); }
.g-mono   { font: 500 12px var(--mono); fill: var(--ink); }
.g-cap    { font: 600 11px var(--sans); fill: var(--ink-3); letter-spacing: .12em; text-transform: uppercase; }
.g-edge   { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.g-edge.dashed { stroke-dasharray: 4 5; }
.g-head   { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.g-elabel { font: 500 12px var(--sans); fill: var(--ink-2); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
.g-axis   { stroke: var(--ink-3); stroke-width: 1; }
.g-zone   { fill: var(--t); }
.g-zone.dashed { fill: url(#hatch); }
.g-edge-h { fill: none; stroke: var(--h); stroke-width: 2; stroke-linecap: round; }
.g-hatch  { stroke: var(--h); stroke-width: 1.25; stroke-opacity: .35; }
.g-unset  { fill: var(--ink-3); opacity: .5; }
.g-rule   { stroke: var(--rule); stroke-width: 1; }
.g-start  { fill: var(--ink-3); }
</style>
<rect class="d-bg" x="0.5" y="0.5" width="919" height="522" rx="14"/><g class="h-blue"><circle cx="117.6" cy="56" r="30" style="fill: var(--t)"/><g transform="translate(117.6 56)"><path d="M-13 -5 a7 7 0 0 1 6.5 -9 a9 9 0 0 1 17 2 a6 6 0 0 1 2 11.5 h-24 a5 5 0 0 1 -1.5 -4.500 Z" transform="translate(1 -3)" style="fill: var(--h)"/><circle cx="0" cy="8" r="4" style="fill: var(--h)"/><path d="M-8 20 a8 7 0 0 1 16 0 Z" style="fill: var(--h)"/></g>
<circle cx="91.6" cy="32" r="10" style="fill: var(--h); stroke: var(--surface); stroke-width: 3"/><text x="91.6" y="36" text-anchor="middle" style="font: 700 11px var(--sans); fill: var(--on-hue)">1</text></g>
<text class="g-title" x="117.6" y="112" text-anchor="middle" style="font-size: 14px">A long session with</text>
<text class="g-title" x="117.6" y="129" text-anchor="middle" style="font-size: 14px">Claude</text>
<text class="g-sub" x="117.6" y="149" text-anchor="middle">You and Claude are deep</text>
<text class="g-sub" x="117.6" y="165" text-anchor="middle">in a big task, and the</text>
<text class="g-sub" x="117.6" y="181" text-anchor="middle">context keeps growing.</text>
<g class="h-teal"><circle cx="288.8" cy="56" r="30" style="fill: var(--t)"/><g transform="translate(288.8 56)"><circle cx="0" cy="0" r="16" style="fill: var(--h)"/><path d="M-7 0 l5 5 l9 -10" style="fill: none; stroke: var(--t); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"/></g>
<circle cx="262.8" cy="32" r="10" style="fill: var(--h); stroke: var(--surface); stroke-width: 3"/><text x="262.8" y="36" text-anchor="middle" style="font: 700 11px var(--sans); fill: var(--on-hue)">2</text></g>
<path class="g-head" d="M199.2 51 l5 5 l-5 5"/>
<text class="g-title" x="288.8" y="112" text-anchor="middle" style="font-size: 14px">A piece of work is</text>
<text class="g-title" x="288.8" y="129" text-anchor="middle" style="font-size: 14px">finished</text>
<text class="g-sub" x="288.8" y="149" text-anchor="middle">The tests pass, the notes</text>
<text class="g-sub" x="288.8" y="165" text-anchor="middle">are written. Most of the</text>
<text class="g-sub" x="288.8" y="181" text-anchor="middle">history is no longer</text>
<text class="g-sub" x="288.8" y="197" text-anchor="middle">needed.</text>
<g class="h-violet"><circle cx="460" cy="56" r="30" style="fill: var(--t)"/><g transform="translate(460 56)"><path d="M-15 -13 h30 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-18 l-8 8 v-8 h-4 a4 4 0 0 1 -4 -4 v-14 a4 4 0 0 1 4 -4 Z" style="fill: var(--h)"/><path d="M-9 -5 h18 M-9 2 h11" style="stroke: var(--t); stroke-width: 2.5; stroke-linecap: round"/></g>
<circle cx="434" cy="32" r="10" style="fill: var(--h); stroke: var(--surface); stroke-width: 3"/><text x="434" y="36" text-anchor="middle" style="font: 700 11px var(--sans); fill: var(--on-hue)">3</text></g>
<path class="g-head" d="M370.4 51 l5 5 l-5 5"/>
<text class="g-title" x="460" y="112" text-anchor="middle" style="font-size: 14px">Claude asks to</text>
<text class="g-title" x="460" y="129" text-anchor="middle" style="font-size: 14px">compact</text>
<text class="g-sub" x="460" y="149" text-anchor="middle">You say &quot;compact after</text>
<text class="g-sub" x="460" y="165" text-anchor="middle">this turn&quot;, or Claude</text>
<text class="g-sub" x="460" y="181" text-anchor="middle">decides itself, and it</text>
<text class="g-sub" x="460" y="197" text-anchor="middle">calls a tool.</text>
<g class="h-green"><circle cx="631.2" cy="56" r="30" style="fill: var(--t)"/><g transform="translate(631.2 56)"><rect x="-17" y="-14" width="14" height="4" rx="1.5" style="fill: var(--h); opacity: .45"/><rect x="-17" y="-8" width="14" height="4" rx="1.5" style="fill: var(--h); opacity: .45"/><rect x="-17" y="-2" width="14" height="4" rx="1.5" style="fill: var(--h); opacity: .45"/><rect x="-17" y="4" width="14" height="4" rx="1.5" style="fill: var(--h); opacity: .45"/><rect x="-17" y="10" width="14" height="4" rx="1.5" style="fill: var(--h); opacity: .45"/><path d="M0 0 h7 m-4 -4 l4 4 l-4 4" style="fill: none; stroke: var(--h); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"/><rect x="10" y="-2" width="9" height="4" rx="1.5" style="fill: var(--h)"/></g>
<circle cx="605.2" cy="32" r="10" style="fill: var(--h); stroke: var(--surface); stroke-width: 3"/><text x="605.2" y="36" text-anchor="middle" style="font: 700 11px var(--sans); fill: var(--on-hue)">4</text></g>
<path class="g-head" d="M541.6 51 l5 5 l-5 5"/>
<text class="g-title" x="631.2" y="112" text-anchor="middle" style="font-size: 14px">Compacted, right</text>
<text class="g-title" x="631.2" y="129" text-anchor="middle" style="font-size: 14px">after the reply</text>
<text class="g-sub" x="631.2" y="149" text-anchor="middle">One second after the</text>
<text class="g-sub" x="631.2" y="165" text-anchor="middle">reply ends: no 20-minute</text>
<text class="g-sub" x="631.2" y="181" text-anchor="middle">wait and no size check.</text>
<g class="h-green"><circle cx="802.4" cy="56" r="30" style="fill: var(--t)"/><g transform="translate(802.4 56)"><circle cx="0" cy="-7" r="7" style="fill: var(--h)"/><path d="M-13 15 a13 12 0 0 1 26 0 Z" style="fill: var(--h)"/></g>
<circle cx="776.4" cy="32" r="10" style="fill: var(--h); stroke: var(--surface); stroke-width: 3"/><text x="776.4" y="36" text-anchor="middle" style="font: 700 11px var(--sans); fill: var(--on-hue)">5</text></g>
<path class="g-head" d="M712.8 51 l5 5 l-5 5"/>
<text class="g-title" x="802.4" y="112" text-anchor="middle" style="font-size: 14px">The next task starts</text>
<text class="g-title" x="802.4" y="129" text-anchor="middle" style="font-size: 14px">small</text>
<text class="g-sub" x="802.4" y="149" text-anchor="middle">Same session, fresh</text>
<text class="g-sub" x="802.4" y="165" text-anchor="middle">context. Every message</text>
<text class="g-sub" x="802.4" y="181" text-anchor="middle">from here on has less to</text>
<text class="g-sub" x="802.4" y="197" text-anchor="middle">read.</text>
<text class="g-cap" x="32" y="243">Context size</text>
<clipPath id="before"><rect x="0" y="0" width="631.2" height="386"/></clipPath><clipPath id="after"><rect x="631.2" y="0" width="920" height="386"/></clipPath>
<g class="h-teal" clip-path="url(#before)"><path d="M32 355 C117.6 355 117.6 304.8 203.2 304.8 C288.8 304.8 288.8 270.5 374.4 270.5 C460 270.5 460 267.8 545.6 267.8 H617.2 C631.2 267.8 631.2 370.8 645.2 370.8 H716.8 C802.4 370.8 802.4 352.3 888 352.3 V384 H32 Z" style="fill: var(--t)"/><path d="M32 355 C117.6 355 117.6 304.8 203.2 304.8 C288.8 304.8 288.8 270.5 374.4 270.5 C460 270.5 460 267.8 545.6 267.8 H617.2 C631.2 267.8 631.2 370.8 645.2 370.8 H716.8 C802.4 370.8 802.4 352.3 888 352.3" style="fill: none; stroke: var(--h); stroke-width: 2.5"/></g>
<g class="h-green" clip-path="url(#after)"><path d="M32 355 C117.6 355 117.6 304.8 203.2 304.8 C288.8 304.8 288.8 270.5 374.4 270.5 C460 270.5 460 267.8 545.6 267.8 H617.2 C631.2 267.8 631.2 370.8 645.2 370.8 H716.8 C802.4 370.8 802.4 352.3 888 352.3 V384 H32 Z" style="fill: var(--t)"/><path d="M32 355 C117.6 355 117.6 304.8 203.2 304.8 C288.8 304.8 288.8 270.5 374.4 270.5 C460 270.5 460 267.8 545.6 267.8 H617.2 C631.2 267.8 631.2 370.8 645.2 370.8 H716.8 C802.4 370.8 802.4 352.3 888 352.3" style="fill: none; stroke: var(--h); stroke-width: 2.5"/></g>
<g class="h-coral"><path d="M631.2 267.8 H880" style="fill: none; stroke: var(--h); stroke-width: 2.5; stroke-dasharray: 2 7; stroke-linecap: round"/>
<circle cx="880" cy="267.8" r="6" style="fill: var(--h); stroke: var(--surface); stroke-width: 3"/>
<text class="g-sub" x="888" y="289.8" text-anchor="end" style="fill: var(--h); font-weight: 500">without it: every later message keeps</text>
<text class="g-sub" x="888" y="304.8" text-anchor="end" style="fill: var(--h); font-weight: 500">carrying the whole history</text>
</g><g class="h-green"><circle cx="880" cy="352.3" r="6" style="fill: var(--h); stroke: var(--surface); stroke-width: 3"/>
<text class="g-title" x="866" y="340.3" text-anchor="end" style="fill: var(--h)">with idle-compact</text></g>
<line class="g-axis" x1="32" y1="384" x2="888" y2="384"/>
<g class="h-violet"><rect x="32" y="408" width="856" height="91" rx="14" style="fill: var(--t)"/>
<circle cx="64" cy="453.5" r="15" style="fill: var(--h)"/><path d="M57 453.5 h14 m-7 -7 v14" style="stroke: var(--on-hue); stroke-width: 2.5; stroke-linecap: round"/></g>
<text class="g-title" x="94" y="433" style="font-size: 14px">Three tools for Claude</text>
<text class="g-sub" x="94" y="452">compact_after_turn compacts as soon as the current reply ends. config reads or changes the settings (how long to wait, how</text>
<text class="g-sub" x="94" y="469">big is big enough) and takes effect at once. status shows the settings and what the timer is doing. So Claude can tune and</text>
<text class="g-sub" x="94" y="486">check idle-compact itself.</text>
</svg>
