<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" role="img" font-family="Inter, system-ui, sans-serif"><title>Coming back early cancels the timer</title>
<style>/* Diagram style guide: shared by every human-facing diagram in docs/.
   Clear and vivid on a cool white page: Inter for words, JetBrains Mono for source,
   six saturated series hues with a fixed role each. Flat marks: no gradients, no glows.
   Tokens first; components below. Generators inline this file, so keep it small. */

:root {
  /* surfaces */
  --bg:        #f4f6fb;
  --surface:   #ffffff;
  --rule:      #dfe4ee;
  --grid:      #eceff6;
  /* text */
  --ink:       #151a2d;
  --ink-2:     #4a5268;
  --ink-3:     #687087;
  /* series hues, each with a tint. Fixed roles across all diagrams:
     blue = user, violet = timer, green = compact fired, coral = cancel, amber = warning/threshold, teal = system */
  --blue:   #2563eb;  --blue-tint:   #e8effe;
  --green:  #0b8457;  --green-tint:  #e0f5ec;
  --amber:  #b45309;  --amber-tint:  #fdf0d9;
  --coral:  #d92d4f;  --coral-tint:  #fde7ec;
  --violet: #7c3aed;  --violet-tint: #efe9fe;
  --teal:   #0e7c9a;  --teal-tint:   #def3f8;
  --on-hue: #ffffff;  /* glyphs inside a marble */

  --sans:  Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: var(--sans);   /* kept for older generators: everything is Inter now */
  --mono:  "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --radius: 16px;
  --space:  8px;            /* everything is a multiple of this */
  --measure: 62ch;          /* comfortable line length for prose */
  --shadow: 0 1px 2px rgb(20 26 45 / .04), 0 8px 24px -12px rgb(20 26 45 / .12);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121622; --surface: #1a1f2e; --rule: #2c3347; --grid: #232a3b;
    --ink: #eef1f8; --ink-2: #aab3c7; --ink-3: #8791a8;
    --blue: #6ea8ff; --green: #3ddc97; --amber: #ffb84d; --coral: #ff7a90; --violet: #b79bff; --teal: #3fd0e6;
    --blue-tint:   color-mix(in srgb, var(--blue) 16%, var(--surface));
    --green-tint:  color-mix(in srgb, var(--green) 16%, var(--surface));
    --amber-tint:  color-mix(in srgb, var(--amber) 16%, var(--surface));
    --coral-tint:  color-mix(in srgb, var(--coral) 16%, var(--surface));
    --violet-tint: color-mix(in srgb, var(--violet) 16%, var(--surface));
    --teal-tint:   color-mix(in srgb, var(--teal) 16%, var(--surface));
    --on-hue: var(--bg);
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121622; --surface: #1a1f2e; --rule: #2c3347; --grid: #232a3b;
  --ink: #eef1f8; --ink-2: #aab3c7; --ink-3: #8791a8;
  --blue: #6ea8ff; --green: #3ddc97; --amber: #ffb84d; --coral: #ff7a90; --violet: #b79bff; --teal: #3fd0e6;
  --blue-tint:   color-mix(in srgb, var(--blue) 16%, var(--surface));
  --green-tint:  color-mix(in srgb, var(--green) 16%, var(--surface));
  --amber-tint:  color-mix(in srgb, var(--amber) 16%, var(--surface));
  --coral-tint:  color-mix(in srgb, var(--coral) 16%, var(--surface));
  --violet-tint: color-mix(in srgb, var(--violet) 16%, var(--surface));
  --teal-tint:   color-mix(in srgb, var(--teal) 16%, var(--surface));
  --on-hue: var(--bg);
  --shadow: none;
  color-scheme: dark;
}

/* svg vocabulary (diagram generators emit these classes) */
.d-grid   { stroke: var(--grid); stroke-width: 1; }
.d-tick   { font: 500 11px var(--sans); fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.d-lane   { font: 600 12px var(--sans); fill: var(--ink-2); }
.d-lane-bar { fill: var(--h); }
.d-line   { stroke: var(--rule); stroke-width: 2; stroke-linecap: round; }
.d-end    { stroke: var(--ink-2); stroke-width: 2; stroke-linecap: round; }
.d-label  { font: 600 13px var(--sans); fill: var(--ink); }
.d-sub    { font: 400 12px var(--sans); fill: var(--ink-2); }
.d-span-label { font: 600 12px var(--sans); fill: var(--ink); }

/* hue helpers: .h-blue etc. set --h / --t for marks. The older names map onto the new roles. */
.h-ink    { --h: var(--ink-2);  --t: var(--grid); }
.h-mute   { --h: var(--ink-3);  --t: var(--grid); }
.h-blue,   .h-sky  { --h: var(--blue);   --t: var(--blue-tint); }
.h-green,  .h-sage { --h: var(--green);  --t: var(--green-tint); }
.h-amber,  .h-sand { --h: var(--amber);  --t: var(--amber-tint); }
.h-coral,  .h-rose { --h: var(--coral);  --t: var(--coral-tint); }
.h-violet, .h-plum { --h: var(--violet); --t: var(--violet-tint); }
.h-teal   { --h: var(--teal);   --t: var(--teal-tint); }
.d-dot      { fill: var(--h); stroke: var(--surface); stroke-width: 3; }
.d-dot-core { fill: var(--h); }
.d-glyph    { font: 700 10px var(--sans); fill: var(--on-hue); }
.d-halo     { fill: var(--t); }
.d-span     { fill: var(--t); stroke: var(--h); stroke-width: 1.5; }
.d-ghost    { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 4 4; }
.d-cancel   { stroke: var(--coral); stroke-width: 2.5; stroke-linecap: round; }
.d-arrow    { fill: var(--h); }
.d-bg       { fill: var(--surface); stroke: var(--rule); }
.d-break-gap   { fill: var(--surface); }
.d-break-mark  { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-linecap: round; }
.d-break-label { font: 500 11px var(--sans); fill: var(--ink-3); }
@media (prefers-reduced-motion: no-preference) {
  .d-mark { animation: d-pop 150ms ease-out both; animation-delay: calc(var(--i, 0) * 70ms); transform-box: fill-box; transform-origin: center; }
  @keyframes d-pop { from { opacity: 0; transform: scale(.6); } }
}

</style>
