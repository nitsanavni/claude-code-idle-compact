<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 326" width="920" height="326" role="img" font-family="Inter, system-ui, sans-serif"><title>Twenty quiet minutes, then a compact</title>
<style>/* Diagram style guide: shared by every human-facing diagram in docs/.
   Calm paper tones, one serif for voice, one sans for labels, one mono for source.
   Tokens first; components below. Generators inline this file, so keep it small. */

:root {
  /* surfaces */
  --bg:        #f6f4ef;
  --surface:   #fdfcf9;
  --rule:      #e6e1d7;
  --grid:      #ece8df;
  /* text */
  --ink:       #2c2b28;
  --ink-2:     #615d55;
  --ink-3:     #9a958b;
  /* hues: muted, similar lightness, each with a soft tint */
  --sky:   #5f86ad;  --sky-tint:   #e3ebf3;
  --sage:  #5f8f72;  --sage-tint:  #e2ede5;
  --sand:  #b8894c;  --sand-tint:  #f4eadb;
  --rose:  #b8695f;  --rose-tint:  #f4e2df;
  --plum:  #84709f;  --plum-tint:  #ebe6f1;
  --mute:  #8f8a80;  --mute-tint:  #ece9e3;

  --serif: "Iowan Old Style", Charter, "Bitstream Charter", Georgia, serif;
  --sans:  Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:  "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --radius: 14px;
  --space:  8px;            /* everything is a multiple of this */
  --measure: 62ch;          /* comfortable line length for prose */
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1c1e; --surface: #222326; --rule: #33353a; --grid: #2a2c30;
    --ink: #e8e6e1; --ink-2: #b0aca4; --ink-3: #7a776f;
    --sky:  #8fb0d1; --sky-tint:  #26313c;
    --sage: #8dbb9d; --sage-tint: #243229;
    --sand: #d7ae75; --sand-tint: #3a3123;
    --rose: #d6928a; --rose-tint: #3b2826;
    --plum: #ad9cc6; --plum-tint: #2f2a38;
    --mute: #8f8b84; --mute-tint: #2c2c2d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1c1e; --surface: #222326; --rule: #33353a; --grid: #2a2c30;
  --ink: #e8e6e1; --ink-2: #b0aca4; --ink-3: #7a776f;
  --sky:  #8fb0d1; --sky-tint:  #26313c;
  --sage: #8dbb9d; --sage-tint: #243229;
  --sand: #d7ae75; --sand-tint: #3a3123;
  --rose: #d6928a; --rose-tint: #3b2826;
  --plum: #ad9cc6; --plum-tint: #2f2a38;
  --mute: #8f8b84; --mute-tint: #2c2c2d;
  color-scheme: dark;
}

/* svg vocabulary (diagram generators emit these classes) */
.d-grid   { stroke: var(--grid); stroke-width: 1; }
.d-tick   { font: 500 11px var(--sans); fill: var(--ink-3); letter-spacing: .04em; }
.d-lane   { font: 600 11px var(--sans); fill: var(--ink-3); letter-spacing: .12em; text-transform: uppercase; }
.d-line   { stroke: var(--rule); stroke-width: 2; stroke-linecap: round; }
.d-end    { stroke: var(--ink-3); stroke-width: 2; stroke-linecap: round; }
.d-label  { font: 500 13px var(--sans); fill: var(--ink); }
.d-sub    { font: 400 12px var(--sans); fill: var(--ink-3); }
.d-span-label { font: 500 12px var(--sans); }

/* hue helpers: .h-sky etc. set --h / --t for marks */
.h-ink  { --h: var(--ink);  --t: var(--mute-tint); }
.h-sky  { --h: var(--sky);  --t: var(--sky-tint); }
.h-sage { --h: var(--sage); --t: var(--sage-tint); }
.h-sand { --h: var(--sand); --t: var(--sand-tint); }
.h-rose { --h: var(--rose); --t: var(--rose-tint); }
.h-plum { --h: var(--plum); --t: var(--plum-tint); }
.h-mute { --h: var(--mute); --t: var(--mute-tint); }
.d-dot      { fill: var(--surface); stroke: var(--h); stroke-width: 2.5; }
.d-dot-core { fill: var(--h); }
.d-halo     { fill: var(--t); }
.d-span     { fill: var(--t); stroke: var(--h); stroke-width: 1.25; stroke-opacity: .55; }
.d-span-label { fill: var(--h); }
.d-cancel   { stroke: var(--h); stroke-width: 2.5; stroke-linecap: round; }
.d-arrow    { fill: none; stroke: var(--h); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; stroke-opacity: .7; }
.d-bg       { fill: var(--surface); stroke: var(--rule); }
.d-break-gap   { fill: var(--surface); }
.d-break-mark  { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-linecap: round; }
.d-break-label { font: 500 11px var(--sans); fill: var(--ink-3); letter-spacing: .04em; }

</style>
<rect class="d-bg" x="0.5" y="0.5" width="919" height="325" rx="16"/>
<line class="d-grid" x1="242.58823529411765" y1="40" x2="242.58823529411765" y2="306" stroke-dasharray="2 5"/>
<text class="d-tick" x="242.58823529411765" y="28" text-anchor="middle">0</text>
<line class="d-grid" x1="460.23529411764696" y1="40" x2="460.23529411764696" y2="306" stroke-dasharray="2 5"/>
<text class="d-tick" x="460.23529411764696" y="28" text-anchor="middle">5m</text>
<line class="d-grid" x1="705.8823529411762" y1="40" x2="705.8823529411762" y2="306" stroke-dasharray="2 5"/>
<text class="d-tick" x="705.8823529411762" y="28" text-anchor="middle">20m</text>
<text class="d-lane" x="76" y="96" text-anchor="end">claude</text>
<line class="d-line" x1="112" y1="92" x2="879.9999999999997" y2="92"/>
<g class="h-plum">
<rect class="d-span" x="155.52941176470588" y="80" width="87.05882352941177" height="24" rx="12"/>
<text class="d-span-label" x="199.05882352941177" y="96.5" text-anchor="middle">turn</text>
</g>
<text class="d-lane" x="76" y="180" text-anchor="end">timer</text>
<line class="d-line" x1="242.58823529411765" y1="176" x2="705.8823529411762" y2="176"/>
<g class="h-sand">
<rect class="d-span" x="242.58823529411765" y="164" width="463.29411764705856" height="24" rx="12"/>
<text class="d-span-label" x="399.9411764705882" y="180.5" text-anchor="middle">idle timer · 20 min</text>
</g>
<text class="d-lane" x="76" y="264" text-anchor="end">compact</text>
<line class="d-line" x1="112" y1="260" x2="879.9999999999997" y2="260"/>
<g class="d-break">
<rect class="d-break-gap" x="557.2941176470587" y="78" width="8" height="28"/>
<path class="d-break-mark" d="M555.7941176470587 98 L560.7941176470587 86 M561.7941176470587 98 L566.7941176470587 86"/>
<rect class="d-break-gap" x="557.2941176470587" y="162" width="8" height="28"/>
<path class="d-break-mark" d="M555.7941176470587 182 L560.7941176470587 170 M561.7941176470587 182 L566.7941176470587 170"/>
<rect class="d-break-gap" x="557.2941176470587" y="246" width="8" height="28"/>
<path class="d-break-mark" d="M555.7941176470587 266 L560.7941176470587 254 M561.7941176470587 266 L566.7941176470587 254"/>
<text class="d-break-label" x="561.2941176470587" y="28" text-anchor="middle">+10 min</text>
</g>
<g class="h-plum">
<circle class="d-halo" cx="155.52941176470588" cy="92" r="13"/>
<circle class="d-dot" cx="155.52941176470588" cy="92" r="6.5"/>
<circle class="d-dot-core" cx="155.52941176470588" cy="92" r="2.5"/>
</g>
<text class="d-label" x="155.52941176470588" y="126" text-anchor="middle">turn.start</text>
<g class="h-sky">
<circle class="d-halo" cx="242.58823529411765" cy="92" r="13"/>
<circle class="d-dot" cx="242.58823529411765" cy="92" r="6.5"/>
<circle class="d-dot-core" cx="242.58823529411765" cy="92" r="2.5"/>
</g>
<text class="d-label" x="242.58823529411765" y="52" text-anchor="middle">turn.complete</text>
<text class="d-sub" x="242.58823529411765" y="69" text-anchor="middle">arms the timer</text>
<g class="h-sand">
<circle class="d-halo" cx="705.8823529411762" cy="176" r="13"/>
<circle class="d-dot" cx="705.8823529411762" cy="176" r="6.5"/>
<circle class="d-dot-core" cx="705.8823529411762" cy="176" r="2.5"/>
</g>
<text class="d-label" x="705.8823529411762" y="210" text-anchor="middle">timer fires</text>
<text class="d-sub" x="705.8823529411762" y="227" text-anchor="middle">context ≥ 120k</text>
<g class="h-sage">
<circle class="d-halo" cx="749.4117647058821" cy="260" r="13"/>
<circle class="d-dot" cx="749.4117647058821" cy="260" r="6.5"/>
<circle class="d-dot-core" cx="749.4117647058821" cy="260" r="2.5"/>
</g>
<text class="d-label" x="749.4117647058821" y="294" text-anchor="middle">compact</text>
<text class="d-sub" x="749.4117647058821" y="311" text-anchor="middle">fresh, small context</text>
</svg>
