<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" role="img" font-family="Inter, system-ui, sans-serif"><title>Twenty quiet minutes, then a compact</title>
<style>/* Diagram style guide: shared by every human-facing diagram in docs/.
   Clear and vivid on a cool white page: Inter for words, JetBrains Mono for source,
   six saturated series hues with a fixed role each. Flat marks: no gradients, no glows.
   Tokens first; components below. Generators inline this file, so keep it small. */

:root {
  /* surfaces */
  --bg:        #f4f6fb;
  --surface:   #ffffff;
  --rule:      #dfe4ee;
  --grid:      #eceff6;
  /* text */
  --ink:       #151a2d;
  --ink-2:     #4a5268;
  --ink-3:     #687087;
  /* series hues, each with a tint. Fixed roles across all diagrams:
     blue = user, violet = timer, green = compact fired, coral = cancel, amber = warning/threshold, teal = system */
  --blue:   #2563eb;  --blue-tint:   #e8effe;
  --green:  #0b8457;  --green-tint:  #e0f5ec;
  --amber:  #b45309;  --amber-tint:  #fdf0d9;
  --coral:  #d92d4f;  --coral-tint:  #fde7ec;
  --violet: #7c3aed;  --violet-tint: #efe9fe;
  --teal:   #0e7c9a;  --teal-tint:   #def3f8;
  --on-hue: #ffffff;  /* glyphs inside a marble */

  --sans:  Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: var(--sans);   /* kept for older generators: everything is Inter now */
  --mono:  "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --radius: 16px;
  --space:  8px;            /* everything is a multiple of this */
  --measure: 62ch;          /* comfortable line length for prose */
  --shadow: 0 1px 2px rgb(20 26 45 / .04), 0 8px 24px -12px rgb(20 26 45 / .12);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121622; --surface: #1a1f2e; --rule: #2c3347; --grid: #232a3b;
    --ink: #eef1f8; --ink-2: #aab3c7; --ink-3: #8791a8;
    --blue: #6ea8ff; --green: #3ddc97; --amber: #ffb84d; --coral: #ff7a90; --violet: #b79bff; --teal: #3fd0e6;
    --blue-tint:   color-mix(in srgb, var(--blue) 16%, var(--surface));
    --green-tint:  color-mix(in srgb, var(--green) 16%, var(--surface));
    --amber-tint:  color-mix(in srgb, var(--amber) 16%, var(--surface));
    --coral-tint:  color-mix(in srgb, var(--coral) 16%, var(--surface));
    --violet-tint: color-mix(in srgb, var(--violet) 16%, var(--surface));
    --teal-tint:   color-mix(in srgb, var(--teal) 16%, var(--surface));
    --on-hue: var(--bg);
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121622; --surface: #1a1f2e; --rule: #2c3347; --grid: #232a3b;
  --ink: #eef1f8; --ink-2: #aab3c7; --ink-3: #8791a8;
  --blue: #6ea8ff; --green: #3ddc97; --amber: #ffb84d; --coral: #ff7a90; --violet: #b79bff; --teal: #3fd0e6;
  --blue-tint:   color-mix(in srgb, var(--blue) 16%, var(--surface));
  --green-tint:  color-mix(in srgb, var(--green) 16%, var(--surface));
  --amber-tint:  color-mix(in srgb, var(--amber) 16%, var(--surface));
  --coral-tint:  color-mix(in srgb, var(--coral) 16%, var(--surface));
  --violet-tint: color-mix(in srgb, var(--violet) 16%, var(--surface));
  --teal-tint:   color-mix(in srgb, var(--teal) 16%, var(--surface));
  --on-hue: var(--bg);
  --shadow: none;
  color-scheme: dark;
}

/* svg vocabulary (diagram generators emit these classes) */
.d-grid   { stroke: var(--grid); stroke-width: 1; }
.d-tick   { font: 500 11px var(--sans); fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.d-lane   { font: 600 12px var(--sans); fill: var(--ink-2); }
.d-lane-bar { fill: var(--h); }
.d-line   { stroke: var(--rule); stroke-width: 2; stroke-linecap: round; }
.d-end    { stroke: var(--ink-2); stroke-width: 2; stroke-linecap: round; }
.d-label  { font: 600 13px var(--sans); fill: var(--ink); }
.d-sub    { font: 400 12px var(--sans); fill: var(--ink-2); }
.d-span-label { font: 600 12px var(--sans); fill: var(--ink); }

/* hue helpers: .h-blue etc. set --h / --t for marks. The older names map onto the new roles. */
.h-ink    { --h: var(--ink-2);  --t: var(--grid); }
.h-mute   { --h: var(--ink-3);  --t: var(--grid); }
.h-blue,   .h-sky  { --h: var(--blue);   --t: var(--blue-tint); }
.h-green,  .h-sage { --h: var(--green);  --t: var(--green-tint); }
.h-amber,  .h-sand { --h: var(--amber);  --t: var(--amber-tint); }
.h-coral,  .h-rose { --h: var(--coral);  --t: var(--coral-tint); }
.h-violet, .h-plum { --h: var(--violet); --t: var(--violet-tint); }
.h-teal   { --h: var(--teal);   --t: var(--teal-tint); }
.d-dot      { fill: var(--h); stroke: var(--surface); stroke-width: 3; }
.d-dot-core { fill: var(--h); }
.d-glyph    { font: 700 10px var(--sans); fill: var(--on-hue); }
.d-halo     { fill: var(--t); }
.d-span     { fill: var(--t); stroke: var(--h); stroke-width: 1.5; }
.d-bold     { stroke: var(--h); stroke-width: 5; stroke-linecap: round; opacity: 0; }  /* a span at the schematic level */
.d-ghost    { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 4 4; }
.d-cancel   { stroke: var(--coral); stroke-width: 2.5; stroke-linecap: round; }
.d-arrow    { fill: var(--h); }
.d-bg       { fill: var(--surface); stroke: var(--rule); }
.d-break-gap   { fill: var(--surface); }
.d-break-mark  { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-linecap: round; }
.d-break-label { font: 500 11px var(--sans); fill: var(--ink-3); }
@media (prefers-reduced-motion: no-preference) {
  .d-mark { animation: d-pop 150ms ease-out both; animation-delay: calc(var(--i, 0) * 70ms); transform-box: fill-box; transform-origin: center; }
  @keyframes d-pop { from { opacity: 0; transform: scale(.6); } }
}

</style>
<rect class="d-bg" x="0.5" y="0.5" width="919" height="339" rx="16"/>
<line class="d-grid d-stretch lv2" style="--s2:0.8" x1="268.9" y1="46" x2="268.9" y2="316"/>
<text class="d-tick lv2" x="268.9" y="36" text-anchor="middle">0</text>
<line class="d-grid d-stretch lv2" style="--s2:0.8" x1="477.2" y1="46" x2="477.2" y2="316"/>
<text class="d-tick lv2" x="477.2" y="36" text-anchor="middle">5m</text>
<line class="d-grid d-stretch lv2" style="--s2:0.8" x1="713.4" y1="46" x2="713.4" y2="316"/>
<text class="d-tick lv2" x="713.4" y="36" text-anchor="middle">20m</text>
<text class="d-break-label lv2" x="574.5" y="36" text-anchor="middle">+10 min</text>
<g class="d-lane-g" transform="translate(0 104)" style="--y1:44px;--y2:90px;--y3:104px">
<g class="h-teal"><rect class="d-lane-bar" x="65.8" y="-7" width="3" height="14" rx="1.5"/></g>
<text class="d-lane lv1" x="120" y="4" text-anchor="end">Claude</text>
<line class="d-line" x1="144" y1="0" x2="880" y2="0"/>
<g class="h-teal">
<line class="d-bold" x1="185.6" y1="0" x2="268.9" y2="0"/>
<rect class="d-span lv1" x="185.6" y="-10" width="83.3" height="20" rx="10"/>
</g>
<g class="d-break"><rect class="d-break-gap" x="570.5" y="-12" width="8" height="24"/>
<path class="d-break-mark" d="M569 6 L574 -6 M575 6 L580 -6"/></g>
<g class="d-mark h-blue" style="--i:0">
<circle class="d-dot" cx="185.6" cy="0" r="9"/><text class="d-glyph lv1" x="185.6" y="3.6" text-anchor="middle">S</text>
</g>
<g class="d-lab lv2" transform="translate(0 31)" style="--y2:31px;--y3:31px">
<text class="d-label lv2" x="206.6" y="0" text-anchor="middle">message sent</text>
<text class="d-sub lv3" x="206.6" y="16" text-anchor="middle">you ask, Claude starts</text>
</g>
<g class="d-mark h-teal" style="--i:1">
<circle class="d-dot" cx="268.9" cy="0" r="9"/><text class="d-glyph lv1" x="268.9" y="3.6" text-anchor="middle">E</text>
</g>
<g class="d-lab lv2" transform="translate(0 -40)" style="--y2:-24px;--y3:-40px">
<text class="d-label lv2" x="268.9" y="0" text-anchor="middle">reply done</text>
<text class="d-sub lv3" x="268.9" y="16" text-anchor="middle">the countdown starts</text>
</g>
</g>
<g class="d-lane-g" transform="translate(0 188)" style="--y1:92px;--y2:160px;--y3:188px">
<g class="h-violet"><rect class="d-lane-bar" x="44.2" y="-7" width="3" height="14" rx="1.5"/></g>
<text class="d-lane lv1" x="120" y="4" text-anchor="end">Countdown</text>
<line class="d-line" x1="268.9" y1="0" x2="713.4" y2="0"/>
<g class="h-violet">
<line class="d-bold" x1="268.9" y1="0" x2="713.4" y2="0"/>
<rect class="d-span lv1" x="268.9" y="-10" width="444.5" height="20" rx="10"/>
<text class="d-span-label lv2" x="419.7" y="4" text-anchor="middle">idle countdown · 20 min</text>
</g>
<g class="d-break"><rect class="d-break-gap" x="570.5" y="-12" width="8" height="24"/>
<path class="d-break-mark" d="M569 6 L574 -6 M575 6 L580 -6"/></g>
<g class="d-mark h-violet" style="--i:2">
<circle class="d-dot" cx="713.4" cy="0" r="9"/><text class="d-glyph lv1" x="713.4" y="3.6" text-anchor="middle">F</text>
</g>
<g class="d-lab lv2" transform="translate(0 31)" style="--y2:31px;--y3:31px">
<text class="d-label lv2" x="713.4" y="0" text-anchor="middle">time is up</text>
<text class="d-sub lv3" x="713.4" y="16" text-anchor="middle">big enough: over 120k tokens</text>
</g>
</g>
<g class="d-lane-g" transform="translate(0 272)" style="--y1:140px;--y2:230px;--y3:272px">
<g class="h-green"><rect class="d-lane-bar" x="37" y="-7" width="3" height="14" rx="1.5"/></g>
<text class="d-lane lv1" x="120" y="4" text-anchor="end">Compaction</text>
<line class="d-line" x1="144" y1="0" x2="880" y2="0"/>
<g class="d-break"><rect class="d-break-gap" x="570.5" y="-12" width="8" height="24"/>
<path class="d-break-mark" d="M569 6 L574 -6 M575 6 L580 -6"/></g>
<g class="d-mark h-green" style="--i:3">
<circle class="d-halo lv2" cx="755.1" cy="0" r="16"/>
<circle class="d-dot" cx="755.1" cy="0" r="9"/><text class="d-glyph lv1" x="755.1" y="3.6" text-anchor="middle">C</text>
</g>
<g class="d-lab lv2" transform="translate(0 31)" style="--y2:31px;--y3:31px">
<text class="d-label lv2" x="755.1" y="0" text-anchor="middle">compacted</text>
<text class="d-sub lv3" x="755.1" y="16" text-anchor="middle">now a short summary</text>
</g>
</g>
</svg>
