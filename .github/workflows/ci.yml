name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan full history
        run: gitleaks git --redact --no-banner -v --config .gitleaks.toml .

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm i -g @anthropic-ai/claude-code
      - name: Validate plugin
        run: claude plugin validate .
      - name: Test plugin
        run: |
          set +e
          out=$(claude plugin test . 2>&1); code=$?
          echo "$out"
          if [ $code -ne 0 ] && echo "$out" | grep -q 'no \*\.test\.ts'; then
            echo "No tests found yet; skipping."; exit 0
          fi
          exit $code
